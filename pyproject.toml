[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "home-assistant-green-button"
version = "0.1.0"
description = "Home Assistant custom integration for importing Green Button (ESPI) energy usage data."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.14"

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["custom_components", "tests"]

[tool.ruff.lint]
select = [
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "D",   # pydocstyle
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "PGH", # pygrep-hooks
    "SIM", # flake8-simplify
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
]
ignore = [
    "D202",  # No blank lines allowed after function docstring
    "D203",  # 1 blank line required before class docstring
    "D213",  # Multi-line docstring summary should start at the second line
    "E501",  # Line too long (handled by the formatter)
    "UP046", # Generic class could use PEP 695 type parameters
    "UP047", # Generic function could use PEP 695 type parameters
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
combine-as-imports = true
known-first-party = ["custom_components.green_button", "tests"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.pytest.ini_options]
addopts = "--cov=custom_components.green_button --cov-report=term-missing"
asyncio_mode = "auto"

[tool.coverage.run]
branch = false
source = ["custom_components/green_button"]

[tool.coverage.report]
show_missing = true
